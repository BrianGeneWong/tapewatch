[project]
name = "tapewatch"
version = "0.2.0"
description = "Real-time materiality classification for market news and SEC filings"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.7",
    "httpx2",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
tapewatch = "tapewatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Selected explicitly rather than inherited. Ruff's defaults drift between
# releases, and a lint gate that changes meaning on `pip install -U` is
# worse than no gate. E/F are the pyflakes+pycodestyle core, I sorts
# imports, UP keeps syntax current, B catches real bugs.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
