[project]
name = "edgar-extract"
version = "0.1.0"
description = "Streaming extraction of structured data from SEC EDGAR filings"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.7",
    "httpx2",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
edgar-extract = "edgar_extract.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
